<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Family Rig-C Viewer</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, ui-monospace, monospace;
      background: #14161a; color: #e6edf3;
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: #1c1f26; border-bottom: 1px solid #2a2e37; flex-wrap: wrap;
      font-size: 13px; z-index: 10;
    }
    h1 { font-size: 14px; font-weight: 700; color: #fff; margin-right: 6px; }
    h1 span { color: #7a8494; font-weight: 400; font-size: 12px; }
    .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
    .group > * { flex-shrink: 0; }
    .group > span, button { white-space: nowrap; }
    label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .sep { width: 1px; height: 20px; background: #2a2e37; margin: 0 4px; }
    button, select {
      background: #262a33; color: #d5d9e0; border: 1px solid #363c4a;
      border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 12px;
      cursor: pointer;
    }
    button:hover, select:hover { background: #323846; }
    button.on { background: #e11d48; border-color: #f43f5e; color: #fff; font-weight: 600; }
    input[type="range"] { width: 80px; accent-color: #e11d48; }
    #wind { width: 120px; }
    input[type="number"] { width: 62px; color: inherit; background: #262a33; border: 1px solid #363c4a; border-radius: 4px; padding: 3px; }
    #pulseBtn { min-width: 100px; }
    #pulseBtn:disabled { cursor: default; opacity: 0.7; }
    #stats { margin-left: auto; font-size: 12px; color: #8fd3a0; font-family: ui-monospace, monospace; }
    #viewport {
      position: relative; flex: 1; min-height: 0; display: flex; overflow: hidden;
    }
    #stage {
      position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; cursor: grab; touch-action: none;
    }
    #stage:active { cursor: grabbing; }
    .bg-dark { background: radial-gradient(circle at 50% 45%, #222631 0%, #12141a 100%); }
    .bg-grey { background: #808080; }
    .bg-white { background: #ffffff; }
    .bg-magenta { background: #ff00ff; }
    #ref-pane { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden;
      border-left: 1px solid #2a2e37; display: none; touch-action: none; cursor: grab; }
    #ref-pane.show { display: block; }
    #refImg { position: absolute; max-width: none; max-height: none; pointer-events: none; }
    #ref-pane .cap { position: absolute; left: 10px; top: 10px; z-index: 2; font-size: 12px;
      color: #d5d9e0; padding: 4px 8px; background: #181b22bb; pointer-events: none; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; }
    @media (orientation: portrait) {
      #viewport { flex-direction: column; }
      #ref-pane { border-left: 0; border-top: 1px solid #2a2e37; }
      header { padding: 6px 8px; gap: 7px; max-height: 42dvh; overflow-y: auto; }
      .sep { display: none; }
      #charSelect { max-width: 76vw; }
    }
    .hud-tip {
      position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: rgba(255,255,255,0.55);
      background: rgba(0,0,0,0.45); padding: 5px 10px; border-radius: 6px; pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Agent Family Rig-C Viewer <span>(@rig-c/play)</span></h1>

    <div class="group">
      <span>캐릭터</span>
      <select id="charSelect">
        <option value="all5" selected>합성 · 에이전트 패밀리 전원 (5인 밀착 합체)</option>
        <option value="all5_wide">합성 · 원본 크롭 간격 (5인 분리 나열)</option>
        <option value="roa">1번 · 로아 (Roa)</option>
        <option value="luna">2번 · 루나 (Luna)</option>
        <option value="jinni">3번 · 지니 (Jinni)</option>
        <option value="naru">4번 · 나루 (Naru)</option>
        <option value="nova">5번 · 노바 (Nova)</option>
        <option value="composed">합성 · 로아 + 루나 (어깨동무 2인)</option>
      </select>
    </div>

    <div class="sep"></div>

    <div class="group">
      <span>배경</span>
      <button data-bg="dark" class="on">다크</button>
      <button data-bg="white">화이트</button>
      <button data-bg="grey">회색</button>
      <button data-bg="magenta">자홍(틈검수)</button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <span>확대</span>
      <button data-zoom="fit">맞춤</button>
      <button data-zoom="1.5">1.5×</button>
      <button data-zoom="2.5">2.5×</button>
      <button data-zoom="4">4×(상반신)</button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <button id="pauseBtn">일시정지</button>
      <label>속도 <input id="speed" type="range" min="0.1" max="2.5" step="0.1" value="1.0" /></label>
      <span id="speedVal" style="font-size:12px;min-width:28px;">1.0×</span>
    </div>

    <div class="sep"></div>

    <div class="group" title="바람과 돌풍은 재생 속도에 맞춰 진행하며 일시정지하면 멈춥니다">
      <span>물리(치마/헤어/가슴)</span>
      <label>기본 바람 <input id="wind" type="range" min="-100" max="100" step="0.1" value="0" /></label>
      <span id="windVal" style="font-size:12px;min-width:36px;">0.0</span>
      <span style="font-size:12px;">현재 <output id="windCurrent" style="display:inline-block;min-width:36px;" aria-label="현재 적용 바람">0.0</output></span>
      <label>중력 <input id="gravity" type="range" min="-3" max="3" step="0.1" value="0" /></label>
      <span id="gravVal" style="font-size:12px;min-width:28px;">0.0</span>
      <button id="gustBtn" aria-pressed="false" title="기본 바람에 사인파 산들바람을 더합니다">산들바람</button>
      <label>돌풍 세기 <input id="gustPeak" type="number" min="0" max="200" step="1" value="48" /></label>
      <label>돌풍 시간 <input id="gustDuration" type="number" min="0.1" max="20" step="0.1" value="2.4" />초</label>
      <button id="pulseBtn" title="선택한 세기의 돌풍을 기본 바람에 더합니다. 시작할 때 기본 바람 방향을 따르며 0이면 오른쪽. 진행 중인 돌풍의 설정은 유지됩니다">돌풍</button>
      <button id="repeatGustBtn" aria-pressed="false" title="돌풍 시작 간격은 6초와 돌풍 시간+0.6초 중 큰 값입니다. 진행 중인 돌풍을 이어받으며, 끄면 진행 중 돌풍은 끝까지 재생합니다">돌풍 반복</button>
      <button id="joltBtn" title="캐릭터에 순간 관성 충격 주기">찰랑이기</button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <button id="refBtn" class="on" aria-pressed="true">원화 비교</button>
      <button id="bonesBtn" aria-pressed="false">뼈</button>
      <button id="meshBtn" aria-pressed="false">메시</button>
      <label>메시 농도 <input id="meshOpacity" type="range" min="0" max="1" step="0.05" value="0.55" /></label>
      <button id="resetBtn">설정 초기화</button>
    </div>

    <div id="stats">로딩 중…</div>
  </header>

  <div id="viewport">
    <div id="stage" class="bg-dark">
      <canvas id="overlay" aria-label="현재 포즈의 뼈와 메시 오버레이"></canvas>
      <div class="hud-tip">드래그: 이동 + 물리 관성 · 마우스 휠: 줌 인/아웃</div>
    </div>
    <div id="ref-pane" class="show bg-dark">
      <div class="cap">원본 일러스트 (painting.png)</div>
      <img id="refImg" src="/docs_family_5chars_recomposite.png" alt="원본" />
    </div>
  </div>

  <script type="module">
    import { l as loadModel, R as RigPlayer } from '/viewer/assets/player.js';
    import { createSceneLoader } from '/viewer/load-lifecycle.mjs';
    import { createWindControls, BASE_WIND_LIMIT, MAX_GUST_PEAK, MIN_GUST_DURATION, MAX_GUST_DURATION } from '/viewer/wind-controls.mjs';
    import { readViewState, writeViewState, defaultViewState } from '/viewer/view-state.mjs';
    import { fitCamera, cameraScale, worldToPanel, zoomAt, referenceFrame } from '/viewer/viewport.mjs';
    import { drawOverlay } from '/viewer/debug-overlay.mjs';

    const stage = document.getElementById('stage');
    const stats = document.getElementById('stats');
    const charSelect = document.getElementById('charSelect');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedInput = document.getElementById('speed');
    const speedVal = document.getElementById('speedVal');
    const windInput = document.getElementById('wind');
    const windVal = document.getElementById('windVal');
    const windCurrent = document.getElementById('windCurrent');
    const gravInput = document.getElementById('gravity');
    const gravVal = document.getElementById('gravVal');
    const gustBtn = document.getElementById('gustBtn');
    const pulseBtn = document.getElementById('pulseBtn');
    const repeatGustBtn = document.getElementById('repeatGustBtn');
    const joltBtn = document.getElementById('joltBtn');
    const refBtn = document.getElementById('refBtn');
    const refPane = document.getElementById('ref-pane');
    const refImg = document.getElementById('refImg');

    const gustPeakInput = document.getElementById('gustPeak');
    const gustDurationInput = document.getElementById('gustDuration');
    windInput.min = String(-BASE_WIND_LIMIT); windInput.max = String(BASE_WIND_LIMIT);
    gustPeakInput.max = String(MAX_GUST_PEAK);
    gustDurationInput.min = String(MIN_GUST_DURATION); gustDurationInput.max = String(MAX_GUST_DURATION);
    const overlay = document.getElementById('overlay');
    const bonesBtn = document.getElementById('bonesBtn');
    const meshBtn = document.getElementById('meshBtn');
    const meshOpacity = document.getElementById('meshOpacity');
    let storage;
    try { storage = globalThis.localStorage; } catch { storage = null; }
    let ui = readViewState(storage);
    let camera = null;
    const boneSpecs = new WeakMap();
    let players = [];
    let container = null;
    let box = null;
    let scale = 1;
    let paused = ui.paused;
    let speed = ui.speed;
    const windControls = createWindControls();

    function syncEnvironment() {
      const { wind: w, gusting } = windControls.read();
      windCurrent.textContent = w.toFixed(1);
      pulseBtn.classList.toggle('on', gusting);
      pulseBtn.disabled = gusting;
      pulseBtn.textContent = gusting ? '돌풍 진행 중' : '돌풍';
      const g = parseFloat(gravInput.value);
      for (const p of players) {
        p.player.environment({ wind: [w, 0], gravity: [0, g] });
      }
    }

    function saveState() {
      ui.character = charSelect.value;
      ui.paused = paused; ui.speed = speed; ui.gravity = Number(gravInput.value);
      if (camera && box) ui.cameras[ui.character] = { ...camera };
      ui.wind = windControls.snapshot?.() ?? windControls.read();
      writeViewState(storage, ui);
    }

    function panelSize(element) { return { width: element.clientWidth, height: element.clientHeight }; }
    function updateViewport() {
      if (!box || !container || !camera) return;
      const stageSize = panelSize(stage), panels = [stageSize];
      if (ui.comparison) panels.push(panelSize(refPane));
      scale = cameraScale(box, panels, camera.zoom);
      if (!(scale > 0)) return;
      const origin = worldToPanel(0, 0, camera, scale, stageSize);
      container.style.cssText = `position: absolute; transform-origin: 0 0; transform: scale(${scale}); left: ${origin.x}px; top: ${origin.y}px`;
      if (ui.comparison) {
        const art = referenceFrame(charSelect.value, box);
        const point = worldToPanel(art.x, art.y + art.height, camera, scale, panelSize(refPane));
        refImg.style.cssText = `left:${point.x}px;top:${point.y}px;width:${art.width * scale}px;height:${art.height * scale}px`;
      }
      for (const p of players) p.player.renderer.syncPixelRatio();
      redrawOverlay();
    }
    function redrawOverlay() {
      if (!camera || !box || !container) return;
      drawOverlay(overlay, players, (x,y) => worldToPanel(x,y,camera,scale,panelSize(stage)), ui, globalThis.devicePixelRatio || 1);
    }
    function fitStage(mult = 1, focusTop = false) {
      if (!box || !container) return;
      camera = fitCamera(box, mult, focusTop);
      updateViewport(); saveState();
    }
    function syncUi() {
      charSelect.value = ui.character;
      paused = ui.paused; speed = ui.speed;
      speedInput.value = String(speed); speedVal.textContent = `${speed.toFixed(1)}×`;
      gravInput.value = String(ui.gravity); gravVal.textContent = ui.gravity.toFixed(1);
      pauseBtn.classList.toggle('on', paused); pauseBtn.textContent = paused ? '재생' : '일시정지';
      stage.className = `bg-${ui.background}`; refPane.className = `${ui.comparison ? 'show ' : ''}bg-${ui.background}`;
      for (const btn of document.querySelectorAll('[data-bg]')) btn.classList.toggle('on', btn.dataset.bg === ui.background);
      for (const [btn, on] of [[refBtn, ui.comparison], [bonesBtn, ui.bones], [meshBtn, ui.mesh]]) {
        btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', String(on));
      }
      meshOpacity.value = String(ui.meshOpacity);
      const wind = windControls.read();
      gustPeakInput.value = String(wind.gustPeak); gustDurationInput.value = String(wind.gustDuration);
      windInput.value = String(wind.base); windVal.textContent = wind.base.toFixed(1);
      gustBtn.classList.toggle('on', wind.breeze); gustBtn.setAttribute('aria-pressed', String(wind.breeze));
      repeatGustBtn.classList.toggle('on', wind.repeat); repeatGustBtn.setAttribute('aria-pressed', String(wind.repeat));
    }
    if (ui.wind && windControls.restore) {
      try { windControls.restore(ui.wind); } catch { ui.wind = null; }
    }
    syncUi();

    function createBlinkState() {
      return {
        cooldown: 0.5 + Math.random() * 2.8,
        elapsed: -1,
        duration: 0.24,
        doubleLeft: 0,
        closeAmount: 0,
      };
    }

    function stepBlinkState(st, dt) {
      if (st.elapsed >= 0) {
        st.elapsed += dt;
        const u = st.elapsed / st.duration;
        if (u >= 1) {
          st.elapsed = -1;
          st.closeAmount = 0;
          if (st.doubleLeft > 0) {
            st.doubleLeft--;
            st.cooldown = 0.09 + Math.random() * 0.06;
          } else {
            st.doubleLeft = Math.random() < 0.20 ? 1 : 0;
            st.cooldown = 2.0 + Math.random() * 3.8;
          }
        } else if (u < 0.30) {
          const t = u / 0.30;
          st.closeAmount = t * t * (3 - 2 * t);
        } else if (u < 0.46) {
          st.closeAmount = 1.0;
        } else {
          const t = (u - 0.46) / 0.54;
          st.closeAmount = 1.0 - t * t * (3 - 2 * t);
        }
      } else {
        st.cooldown -= dt;
        if (st.cooldown <= 0) {
          st.elapsed = 0;
          st.duration = 0.21 + Math.random() * 0.06;
        }
      }
    }

    function createRigEntry([key, offsetX = 0, phaseOffset = 0, offsetY = 0, zIndex = 1], assets, target) {
      const sub = target.appendChild(document.createElement('div'));
      sub.style.cssText = `position: absolute; left: ${offsetX}px; top: ${offsetY}px; z-index: ${zIndex};`;

      const blink = createBlinkState();
      const player = new RigPlayer(sub, assets, {
        adjust(pose) {
          const names = pose.names;
          if (!names.includes('eye_r') || !names.includes('eye_l')) return;
          const sy = 1.0 - blink.closeAmount * 0.88;
          const by = -blink.closeAmount * 1.2;
          const er = pose.bone('eye_r');
          const el = pose.bone('eye_l');
          er.scaleY = (er.setup.scaleY ?? 1) * sy;
          el.scaleY = (el.setup.scaleY ?? 1) * sy;
          if (names.includes('brow_r')) {
            const br = pose.bone('brow_r');
            br.y = (br.setup.y ?? 0) + by;
          }
          if (names.includes('brow_l')) {
            const bl = pose.bone('brow_l');
            bl.y = (bl.setup.y ?? 0) + by;
          }
        },
      });
      try {
        const anim = assets.animations[0]?.name || 'idle';
        player.play(anim);
        if (phaseOffset > 0) player.frame(phaseOffset);
        player.frame(0);
        const b = assets.stage ?? player.bounds() ?? { x: -400, y: 0, width: 800, height: 2284 };
        return { key, player, sub, bounds: b, offsetX, offsetY, zIndex, anim, blink, boneSpecs: boneSpecs.get(assets) ?? [] };
      } catch (error) {
        try { player.dispose(); } finally { sub.remove(); }
        throw error;
      }
    }

    const sceneLoader = createSceneLoader({
      createStage() {
        const target = document.createElement('div');
        target.id = 'rig-root';
        return target;
      },
      async loadAssets([key], { bust }) {
        let specs = [];
        const assets = await loadModel({ modelUrl: `/${key}/out/check/build/skeleton.model.json?v=${bust}`,
          async fetch(...args) {
            const response = await fetch(...args);
            if (response.ok) specs = (await response.clone().json()).bones;
            return response;
          },
        });
        boneSpecs.set(assets, specs);
        return assets;
      },
      createEntry: createRigEntry,
      loading({ key }) {
        players = [];
        container = null;
        box = null;
        stats.textContent = `${key} 로딩 중…`;
        overlay.width = overlay.width;
      },
      failed(error) {
        players = [];
        container = null;
        box = null;
        stats.textContent = `에러: ${error.message}`;
        console.error(error);
      },
      publish({ key, bust }, target, entries) {
        players = entries;
        container = stage.appendChild(target);
        if (key === 'all5') {
          // Cohesive 5-character family formation:
          // Roa (z=3) rests her left arm on Luna's (z=2, ox=435) right shoulder;
          // Jinni (z=4, ox=995) stands center front;
          // Naru (z=3, ox=1540) and Nova (z=2, ox=1915) stand closely on the right.
          box = {
            x: players[0].bounds.x,
            y: 0,
            width: 1915 + players[4].bounds.width,
            height: 2284,
          };
          refImg.src = `/docs_family_5chars_recomposite.png?v=${bust}`;
          stats.textContent = `합성 (5인 밀착 합체: roa · luna · jinni · naru · nova) · 비동기 랜덤 블링크 · physics ON`;
        } else if (key === 'all5_wide') {
          // Original 4x crop offsets: roa=96, luna=896 (+800), jinni=1688 (+1592), naru=2496 (+2400), nova=3296 (+3200)
          box = {
            x: players[0].bounds.x,
            y: 0,
            width: 3200 + players[4].bounds.width,
            height: 2284,
          };
          refImg.src = `/group_4096x2284_animesharp_rgba.png?v=${bust}`;
          stats.textContent = `합성 (원본 간격 5인 나열) · 비동기 랜덤 블링크 · physics ON`;
        } else if (key === 'composed') {
          const [p1, p2] = players;
          box = {
            x: p1.bounds.x,
            y: Math.min(p1.bounds.y, p2.bounds.y),
            width: 435 + p2.bounds.width,
            height: Math.max(p1.bounds.height, p2.bounds.height),
          };
          refImg.src = `/docs_family_5chars_recomposite.png?v=${bust}`;
          stats.textContent = `합성 (roa + luna 어깨동무) · physics ON · 60fps`;
        } else {
          const [p] = players;
          box = p.bounds;
          refImg.src = `/${key}/inputs/painting.png?v=${bust}`;
          stats.textContent = `${key} · anim: ${p.anim} · 비동기 랜덤 블링크 · physics ON`;
        }

        syncEnvironment();
        camera = ui.cameras[key] ? { ...ui.cameras[key] } : fitCamera(box);
        updateViewport(); saveState();
      },
    });

    function openCharacter(key) {
      let lineup;
      if (key === 'all5') {
        lineup = [['roa', 0, 0, 0, 3], ['luna', 435, 0.06, 0, 2], ['jinni', 995, 0.45, 0, 4], ['naru', 1540, 0.85, 0, 3], ['nova', 1915, 1.25, 0, 2]];
      } else if (key === 'all5_wide') {
        lineup = [['roa', 0, 0, 0, 1], ['luna', 800, 0.65, 0, 1], ['jinni', 1592, 1.35, 0, 1], ['naru', 2400, 2.05, 0, 1], ['nova', 3200, 2.75, 0, 1]];
      } else if (key === 'composed') {
        lineup = [['roa', 0, 0, 0, 3], ['luna', 435, 0.06, 0, 2]];
      } else {
        lineup = [[key, 0, 0]];
      }
      return sceneLoader.open({ key, lineup, bust: Date.now() });
    }

    // Background switch
    document.querySelectorAll('[data-bg]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        ui.background = btn.dataset.bg;
        syncUi(); saveState();
      });
    });

    // Zoom presets
    document.querySelectorAll('[data-zoom]').forEach(btn => {
      btn.addEventListener('click', () => {
        const z = btn.dataset.zoom;
        if (z === 'fit') fitStage(1, false);
        else if (z === '4') fitStage(3.2, true);
        else fitStage(parseFloat(z), false);
      });
    });

    // Both comparison surfaces share a world-space camera and cursor-anchored zoom.
    for (const pane of [stage, refPane]) {
      pane.addEventListener('wheel', e => {
        e.preventDefault();
        if (!container || !camera) return;
        const rect = pane.getBoundingClientRect();
        const delta = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? pane.clientHeight : 1);
        camera = zoomAt(camera, scale, Math.exp(-delta * .002), { x: e.clientX - rect.left, y: e.clientY - rect.top }, panelSize(pane));
        updateViewport(); saveState();
      }, { passive: false });
      let held = null;
      pane.addEventListener('pointerdown', e => { held = { x:e.clientX, y:e.clientY }; pane.setPointerCapture(e.pointerId); });
      pane.addEventListener('pointerup', () => { held = null; saveState(); });
      pane.addEventListener('pointercancel', () => { held = null; });
      pane.addEventListener('pointermove', e => {
        if (!held || !camera || !container) return;
        const dx = e.clientX-held.x, dy = e.clientY-held.y;
        held = { x:e.clientX, y:e.clientY };
        camera.x -= dx/scale; camera.y += dy/scale;
        if (pane === stage) {
          const clampMove = (v, lim) => Math.max(-lim, Math.min(lim, v));
          const impulse = { x:clampMove(dx/scale*.25,8), y:clampMove(-dy/scale*.25,6) };
          for (const p of players) p.player.moved(impulse);
        }
        updateViewport();
      });
    }
    if (typeof ResizeObserver === 'function') {
      const observer = new ResizeObserver(updateViewport); observer.observe(stage); observer.observe(refPane);
    }

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.classList.toggle('on', paused);
      pauseBtn.textContent = paused ? '재생' : '일시정지';
    });

    speedInput.addEventListener('input', () => {
      speed = parseFloat(speedInput.value);
      speedVal.textContent = `${speed.toFixed(1)}×`;
    });

    windInput.addEventListener('input', () => {
      const w = parseFloat(windInput.value);
      windControls.setBase(w);
      windVal.textContent = w.toFixed(1);
      syncEnvironment();
    });

    gravInput.addEventListener('input', () => {
      const g = parseFloat(gravInput.value);
      gravVal.textContent = g.toFixed(1);
      syncEnvironment();
    });

    gustBtn.addEventListener('click', () => {
      const enabled = !windControls.read().breeze;
      windControls.setBreeze(enabled);
      gustBtn.classList.toggle('on', enabled);
      gustBtn.setAttribute('aria-pressed', String(enabled));
      syncEnvironment();
    });

    for (const [input, setter] of [[gustPeakInput, 'setGustPeak'], [gustDurationInput, 'setGustDuration']]) {
      const applyValue = () => {
        const value = Number(input.value);
        if (input.value.trim() && Number.isFinite(value) && value >= Number(input.min || 0) && value <= Number(input.max)) {
          windControls[setter](value); saveState();
        }
      };
      input.addEventListener('input', applyValue);
      input.addEventListener('change', () => { applyValue(); syncUi(); saveState(); });
    }

    pulseBtn.addEventListener('click', () => {
      windControls.triggerGust();
      syncEnvironment();
    });

    repeatGustBtn.addEventListener('click', () => {
      const enabled = !windControls.read().repeat;
      windControls.setRepeat(enabled);
      repeatGustBtn.classList.toggle('on', enabled);
      repeatGustBtn.setAttribute('aria-pressed', String(enabled));
      syncEnvironment();
    });

    joltBtn.addEventListener('click', () => {
      if (players.length === 0) return;
      for (const p of players) p.player.moved({ x: 18, y: -10 });
      setTimeout(() => {
        for (const p of players) p.player.moved({ x: -18, y: 10 });
      }, 90);
    });

    refBtn.addEventListener('click', () => {
      ui.comparison = !ui.comparison; syncUi(); updateViewport(); saveState();
    });
    bonesBtn.addEventListener('click', () => { ui.bones = !ui.bones; syncUi(); redrawOverlay(); saveState(); });
    meshBtn.addEventListener('click', () => { ui.mesh = !ui.mesh; syncUi(); redrawOverlay(); saveState(); });
    meshOpacity.addEventListener('input', () => { ui.meshOpacity = Number(meshOpacity.value); redrawOverlay(); saveState(); });
    document.getElementById('resetBtn').addEventListener('click', () => {
      ui = defaultViewState(); camera = null;
      windControls.restore?.(null);
      if (!windControls.restore) { windControls.setBase(0); windControls.setBreeze(false); windControls.setRepeat(false); }
      syncUi(); saveState(); openCharacter(ui.character);
    });
    charSelect.addEventListener('change', () => { camera = null; ui.character = charSelect.value; saveState(); openCharacter(charSelect.value); });
    // Persist stable control settings on changes and when leaving; reload begins a fresh physics run.
    for (const element of [pauseBtn, speedInput, windInput, gravInput, gustBtn, pulseBtn, repeatGustBtn]) {
      element.addEventListener(element === speedInput || element === windInput || element === gravInput ? 'input' : 'click', saveState);
    }
    globalThis.addEventListener?.('pagehide', saveState);
    document.addEventListener?.('visibilitychange', () => { if (document.hidden) saveState(); });
    refImg.addEventListener('load', updateViewport);
    globalThis.addEventListener?.('resize', updateViewport);

    let last = performance.now();
    requestAnimationFrame(function tick(now) {
      const dt = Math.min((now - last) / 1000, 1 / 15);
      last = now;
      if (players.length > 0 && !paused) {
        windControls.advance(dt * speed);
        syncEnvironment();
        for (const p of players) {
          if (p.blink) stepBlinkState(p.blink, dt * speed);
          p.player.frame(dt * speed);
        }
      }
      redrawOverlay();
      requestAnimationFrame(tick);
    });

    openCharacter(ui.character);
  </script>
</body>
</html>
