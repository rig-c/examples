name: Family demo

on:
  pull_request:
    paths:
      - 'family/**'
      - '.github/workflows/family-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Record source and frozen input identity
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, pathlib, re
          pathlib.Path('evidence/source.json').write_text(json.dumps({'sourceSha': os.environ['SOURCE_SHA']}, indent=2))
          text = pathlib.Path('family/README.md').read_text()
          links = re.findall(r'!\[[^]]*\]\((\./[^)]+)\)', text)
          assert links, 'README must contain its example images'
          for link in links:
              assert (pathlib.Path('family')/link).is_file(), f'missing README image: {link}'
          PY
          node --version | tee evidence/node-version.txt
          bun --version | tee evidence/bun-version.txt
          node family/tools/verify-accepted.mjs --check-inputs | tee evidence/input-inventory.json
      - name: Input refusal controls and viewer lifecycle, state and wind regressions
        run: node --test family/tools/verify-accepted.test.mjs family/viewer/*.test.mjs 2>&1 | tee evidence/regressions.log
      - name: Install exact public compiler and official oracle
        run: bun install --cwd family/tools/outline-field-islands --frozen-lockfile 2>&1 | tee evidence/install.log
      - name: Rebuild all 5 characters × 4 outfits from config + declared repairs, diff compiled models, and run full parts check
        run: |
          set -o pipefail
          bun family/tools/verify-accepted.mjs --out "$RUNNER_TEMP/family-accepted" 2>&1 | tee evidence/fresh-build.log
          cp "$RUNNER_TEMP/family-accepted/reproducibility/reproducibility.txt" evidence/reproducibility.txt
          cp "$RUNNER_TEMP/family-accepted/reproducibility/reproducibility.json" evidence/reproducibility.json
      - name: Preserve source, verdicts, skips and raw public gate output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: family-demo-${{ env.SOURCE_SHA }}
          path: |
            evidence/
            ${{ runner.temp }}/family-accepted/
          if-no-files-found: warn
          retention-days: 7
