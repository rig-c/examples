# Hygiene: runs on every pull request, including the ones the Family demo
# workflow's path filter skips, so a docs-only change still has a check to
# merge on. It is also a real gate: a local home path committed to this public
# tree is refused by name (2026-10-23: fourteen meta.json files carried one).
name: Hygiene
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No local home paths in tracked files
        run: |
          set -eu
          # Historical text records use <home> or <nova-home> prefixes.
          # Ignore binary content; no tracked text path is exempt.
          if git grep -I -n -E '/(Users|home)/[A-Za-z0-9._-]+/|[~]/' -- . ; then
            echo "::error::a local home path is committed; replace it with a repository-relative path or an argument"
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi
          echo "no local home paths"
      - name: No source-video links in tracked files
        run: |
          set -eu
          # Source videos are withheld: the corpus records that a pose came from
          # a video, never which one (2026-10-26: two Shorts IDs were public in
          # 13 files). Refused by name so it cannot come back.
          if git grep -I -n -i -E '(youtube\.com/(shorts|watch)|youtu\.be/|tiktok\.com/|instagram\.com/(reel|p)/|douyin\.com/|bilibili\.com/video)' -- . ; then
            echo "::error::a source-video link is committed; source videos are withheld - describe the source without its link or ID"
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi
          echo "no source-video links"
